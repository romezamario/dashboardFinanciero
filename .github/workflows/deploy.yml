name: Deploy frontend a Cloudflare Pages

# Solo corre cuando cambia el frontend, para no acoplarse a commits
# del pipeline local (parsers/transform/sync/app).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/preparar-dashboard-personal.sh"
  # Para refrescar /macro.json (indicadores de FRED) aunque no cambie el
  # código: de lunes a viernes, después de los reportes de las 8:30 ET y al
  # cierre del mercado.
  schedule:
    - cron: "0 15 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # FRED no responde a Cloudflare ni permite CORS, así que los datos macro
      # se bajan aquí y se publican como archivo estático. En la corrida
      # programada un fallo detiene el deploy (sigue en línea la versión
      # anterior); en un push no debe bloquear el resto de cambios.
      - name: Descargar indicadores macro (FRED)
        working-directory: frontend
        run: node scripts/descargar-macro.ts
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Desde frontend/ para que wrangler encuentre functions/ (la Pages
          # Function de /api/cotizaciones) junto a dist/.
          workingDirectory: frontend
          command: pages deploy dist --project-name=dashboard-financiero

      # Liga nueva del dashboard personal (Mario, 2026-11-08: "que ya no sea
      # dashboard financiero"). Pages no permite renombrar un proyecto, así que
      # se crea `dashboard-personal` y se despliega en los dos mientras tanto.
      # Este paso NUNCA publica sin Cloudflare Access: crea el proyecto (si no
      # existe), agrega su dominio a la aplicación de Access del dashboard,
      # copia las variables de texto del proyecto viejo y comprueba que el
      # dominio nuevo ya redirige al login de Access. Si algo falla, el deploy
      # al proyecto nuevo se salta (el viejo ya quedó publicado arriba).
      - name: Preparar proyecto dashboard-personal (Access primero)
        id: personal
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/preparar-dashboard-personal.sh

      # Los secretos de Trading no se pueden leer del proyecto viejo por la API:
      # si están como secretos de GitHub (mismo nombre), se cargan al nuevo.
      - name: Secretos de Trading en dashboard-personal
        if: steps.personal.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN_AGENTE: ${{ secrets.GITHUB_TOKEN_AGENTE }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          for nombre in GITHUB_TOKEN_AGENTE ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY; do
            if [ -n "${!nombre}" ]; then
              printf '%s' "${!nombre}" | npx --yes wrangler@4 pages secret put "$nombre" --project-name=dashboard-personal >/dev/null && echo "✓ $nombre"
            else
              echo "::notice::Falta el secreto de GitHub $nombre (Trading no lo tendrá en dashboard-personal)."
            fi
          done

      - name: Deploy a dashboard-personal
        if: steps.personal.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=dashboard-personal --branch=main --commit-dirty=true
