name: Deploy frontend a Cloudflare Pages

# Solo corre cuando cambia el frontend, para no acoplarse a commits
# del pipeline local (parsers/transform/sync/app).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/preparar-dashboard-personal.sh"
  # Para refrescar /macro.json (indicadores de FRED) aunque no cambie el
  # código: de lunes a viernes, después de los reportes de las 8:30 ET y al
  # cierre del mercado.
  schedule:
    - cron: "0 15 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # FRED no responde a Cloudflare ni permite CORS, así que los datos macro
      # se bajan aquí y se publican como archivo estático. En la corrida
      # programada un fallo detiene el deploy (sigue en línea la versión
      # anterior); en un push no debe bloquear el resto de cambios.
      - name: Descargar indicadores macro (FRED)
        working-directory: frontend
        run: node scripts/descargar-macro.ts
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # La liga vieja (proyecto `dashboard-financiero`, dashboard-financiero-c5z)
      # se dio de baja el 2026-11-26 (Mario: "ya no quiero que siga activo el
      # dominio dashboard financiero"): solo se publica `dashboard-personal`.
      # Este paso NUNCA publica sin Cloudflare Access: crea el proyecto (si no
      # existe), se asegura de que su dominio esté en la aplicación de Access del
      # dashboard y comprueba que ya redirige al login de Access. Si algo falla,
      # el deploy se salta y sigue en línea el despliegue anterior.
      - name: Preparar proyecto dashboard-personal (Access primero)
        id: personal
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/preparar-dashboard-personal.sh

      # Secretos de Trading: si están como secretos de GitHub, se cargan al proyecto.
      - name: Secretos de Trading en dashboard-personal
        if: steps.personal.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN_AGENTE: ${{ secrets.GITHUB_TOKEN_AGENTE }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # Invitados que también entran a /viajes/ (ver y editar), separados por coma.
          CORREOS_VIAJES: ${{ secrets.CORREOS_VIAJES }}
        run: |
          for nombre in GITHUB_TOKEN_AGENTE ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY CORREOS_VIAJES; do
            if [ -n "${!nombre}" ]; then
              printf '%s' "${!nombre}" | npx --yes wrangler@4 pages secret put "$nombre" --project-name=dashboard-personal >/dev/null && echo "✓ $nombre"
            else
              echo "::notice::Falta el secreto de GitHub $nombre (Trading no lo tendrá en dashboard-personal)."
            fi
          done

      # Bitácora de viajes (repo privado romezamario/GestionViajes) servida aquí
      # mismo en /viajes/ (gestion-viajes-7wo se retiró el 2026-11-26). Necesita el
      # secreto TOKEN_VIAJES (token de GitHub con lectura de GestionViajes). Si
      # falta o algo falla, NO se publica dashboard-personal y sigue en línea el
      # despliegue anterior (con Viajes).
      - name: ¿Hay TOKEN_VIAJES?
        id: hay_token_viajes
        env:
          TOKEN_VIAJES: ${{ secrets.TOKEN_VIAJES }}
        run: |
          if [ -n "$TOKEN_VIAJES" ]; then echo "si=1" >> "$GITHUB_OUTPUT"; else echo "::error::Falta el secreto TOKEN_VIAJES: sin él dashboard-personal se publicaría sin Viajes."; exit 1; fi

      - name: Traer GestionViajes
        id: repo_viajes
        if: steps.personal.outcome == 'success'
        uses: actions/checkout@v5
        with:
          repository: romezamario/gestionviajes
          token: ${{ secrets.TOKEN_VIAJES }}
          path: _viajes
          persist-credentials: false

      - name: Incluir Viajes en dashboard-personal
        if: steps.personal.outcome == 'success'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIAJES_DIR: _viajes
        run: bash .github/scripts/incluir-viajes.sh

      - name: Deploy a dashboard-personal
        if: steps.personal.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=dashboard-personal --branch=main --commit-dirty=true
