name: Deploy Ordena tu Lana (instancia de clientes)

# El mismo frontend que deploy.yml, construido con VITE_EDICION=producto
# (sin QQQ/Macro, Shophunters ni Wiki; ver frontend/src/lib/edicion.ts) y
# apuntando al Supabase de clientes. Va a otro proyecto de Cloudflare Pages,
# sin Cloudflare Access delante. Mientras no existan sus secretos, se salta.
#
# Dos ambientes (decisión del dueño, 2026-10-11: "validar antes de publicar"):
# - cada push a main va a PRUEBAS: https://pruebas.ordenatulana.pages.dev
#   (despliegue de vista previa de Pages, con --branch=pruebas);
# - PRODUCCIÓN (ordenatulana.com) solo cambia al correr este workflow a mano
#   desde Actions con destino "produccion" (rama de producción de Pages: main).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-producto.yml"
  workflow_dispatch:
    inputs:
      destino:
        description: "¿A dónde publicar?"
        type: choice
        options: [pruebas, produccion]
        default: pruebas

concurrency:
  group: deploy-producto-${{ inputs.destino || 'pruebas' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.PRODUCTO_VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTO_VITE_SUPABASE_ANON_KEY }}
      VITE_EDICION: producto
      # Mercado Pago: pruebas cobra con las credenciales de PRUEBA (y muestra el
      # aviso "Modo de prueba"); producción, con las de PRODUCCIÓN. Sin la llave
      # pública de producción, ordenatulana.com manda a pagar a Mercado Pago
      # (sin formulario embebido) y las funciones responden que los pagos aún
      # no están disponibles mientras falte su Access Token.
      VITE_MP_PUBLIC_KEY: ${{ inputs.destino == 'produccion' && secrets.PRODUCTO_MP_PUBLIC_KEY_PRODUCCION || secrets.PRODUCTO_MP_PUBLIC_KEY }}
      VITE_MP_MODO: ${{ inputs.destino == 'produccion' && 'produccion' || 'prueba' }}
      # Rama de Pages: "main" es producción; cualquier otra es vista previa.
      RAMA_PAGES: ${{ inputs.destino == 'produccion' && 'main' || 'pruebas' }}
    steps:
      - name: ¿Está configurada la instancia de clientes?
        id: config
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "lista=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin PRODUCTO_VITE_SUPABASE_URL / PRODUCTO_VITE_SUPABASE_ANON_KEY: no se despliega Ordena tu Lana."
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.lista == 'true'

      - uses: actions/setup-node@v5
        if: steps.config.outputs.lista == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.config.outputs.lista == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build (edición producto)
        if: steps.config.outputs.lista == 'true'
        working-directory: frontend
        run: npm run build

      # Buscadores y navegadores piden /favicon.ico y /favicon.svg aunque el HTML
      # apunte a /marca/: sin esto servían el ícono de Vite (el rayo morado).
      - name: Íconos de la marca en la raíz
        if: steps.config.outputs.lista == 'true'
        working-directory: frontend
        run: cp dist/marca/favicon.ico dist/favicon.ico && cp dist/marca/favicon.svg dist/favicon.svg

      # La Pages Function de /api/cotizaciones solo sirve a la pestaña QQQ,
      # que no existe en esta edición: no se publica.
      - name: Quitar functions/
        if: steps.config.outputs.lista == 'true'
        working-directory: frontend
        run: rm -rf functions

      # Crea el proyecto de Pages la primera vez; después falla con "ya existe"
      # y se ignora (continue-on-error), así nunca bloquea el deploy.
      - name: Crear proyecto de Pages (si no existe)
        if: steps.config.outputs.lista == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages project create ordenatulana --production-branch=main

      - name: Deploy a Cloudflare Pages
        if: steps.config.outputs.lista == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=ordenatulana --branch=${{ env.RAMA_PAGES }} --commit-dirty=true

      - name: Resumen
        if: steps.config.outputs.lista == 'true'
        run: |
          if [ "$RAMA_PAGES" = main ]; then destino="PRODUCCIÓN (ordenatulana.com)"; else destino="PRUEBAS (https://pruebas.ordenatulana.pages.dev)"; fi
          echo "Publicado en $destino, commit ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
