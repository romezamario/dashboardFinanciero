name: Copiar secretos a Ordena tu Lana (un solo uso)

# Copia los secretos del producto al repo nuevo ordena-tu-lana/ordenatulana sin
# que nadie los vea (GitHub no deja leer ni exportar secretos). Usa un token
# temporal TOKEN_REPO_NUEVO (fine-grained, solo ese repo, "Secrets: Read and
# write"). Nunca imprime valores, solo nombres. Se borra al terminar la
# separación (/mnt/project-files/notas/separar-repositorio-github.md, paso 5).
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo destino"
        default: ordena-tu-lana/ordenatulana

jobs:
  copiar:
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.TOKEN_REPO_NUEVO }}
      DESTINO: ${{ inputs.repo }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTO_MP_ACCESS_TOKEN: ${{ secrets.PRODUCTO_MP_ACCESS_TOKEN }}
      PRODUCTO_MP_ACCESS_TOKEN_PRODUCCION: ${{ secrets.PRODUCTO_MP_ACCESS_TOKEN_PRODUCCION }}
      PRODUCTO_MP_CORREO_COMPRADOR_PRUEBA: ${{ secrets.PRODUCTO_MP_CORREO_COMPRADOR_PRUEBA }}
      PRODUCTO_MP_PUBLIC_KEY: ${{ secrets.PRODUCTO_MP_PUBLIC_KEY }}
      PRODUCTO_MP_PUBLIC_KEY_PRODUCCION: ${{ secrets.PRODUCTO_MP_PUBLIC_KEY_PRODUCCION }}
      PRODUCTO_MP_WEBHOOK_SECRET_PRODUCCION: ${{ secrets.PRODUCTO_MP_WEBHOOK_SECRET_PRODUCCION }}
      PRODUCTO_SMTP_HOST: ${{ secrets.PRODUCTO_SMTP_HOST }}
      PRODUCTO_SMTP_PASS: ${{ secrets.PRODUCTO_SMTP_PASS }}
      PRODUCTO_SMTP_PUERTO: ${{ secrets.PRODUCTO_SMTP_PUERTO }}
      PRODUCTO_SMTP_REMITENTE: ${{ secrets.PRODUCTO_SMTP_REMITENTE }}
      PRODUCTO_SMTP_USUARIO: ${{ secrets.PRODUCTO_SMTP_USUARIO }}
      PRODUCTO_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTO_SUPABASE_ACCESS_TOKEN }}
      PRODUCTO_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTO_SUPABASE_DB_PASSWORD }}
      PRODUCTO_SUPABASE_ORGANIZACION: ${{ secrets.PRODUCTO_SUPABASE_ORGANIZACION }}
      PRODUCTO_SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTO_SUPABASE_PROJECT_ID }}
      PRODUCTO_VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTO_VITE_SUPABASE_ANON_KEY }}
      PRODUCTO_VITE_SUPABASE_URL: ${{ secrets.PRODUCTO_VITE_SUPABASE_URL }}
    steps:
      - name: Copiar
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Falta el secreto TOKEN_REPO_NUEVO."; exit 1; fi
          copiados=0; vacios=""
          for nombre in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            PRODUCTO_MP_ACCESS_TOKEN PRODUCTO_MP_ACCESS_TOKEN_PRODUCCION PRODUCTO_MP_CORREO_COMPRADOR_PRUEBA \
            PRODUCTO_MP_PUBLIC_KEY PRODUCTO_MP_PUBLIC_KEY_PRODUCCION PRODUCTO_MP_WEBHOOK_SECRET_PRODUCCION \
            PRODUCTO_SMTP_HOST PRODUCTO_SMTP_PASS PRODUCTO_SMTP_PUERTO PRODUCTO_SMTP_REMITENTE PRODUCTO_SMTP_USUARIO \
            PRODUCTO_SUPABASE_ACCESS_TOKEN PRODUCTO_SUPABASE_DB_PASSWORD PRODUCTO_SUPABASE_ORGANIZACION \
            PRODUCTO_SUPABASE_PROJECT_ID PRODUCTO_VITE_SUPABASE_ANON_KEY PRODUCTO_VITE_SUPABASE_URL; do
            valor="${!nombre}"
            if [ -z "$valor" ]; then vacios="$vacios $nombre"; continue; fi
            printf '%s' "$valor" | gh secret set "$nombre" --repo "$DESTINO" >/dev/null
            echo "Copiado: $nombre"; copiados=$((copiados + 1))
          done
          echo "Total copiados: $copiados"
          [ -n "$vacios" ] && echo "::notice::No existen en este repo (no se copiaron):$vacios"
          exit 0
