name: CI

# Red de seguridad antes de llegar a main (que despliega solo): typecheck,
# lint y pruebas del frontend, y las pruebas del pipeline local (Python), en
# cada push y PR. deploy.yml solo construye en main y no corre ni lint ni
# pruebas. Los dos jobs corren juntos: el de Python tarda ~1 min.
on:
  push:
    paths:
      - "frontend/**"
      - "app/**"
      - "parsers/**"
      - "transform/**"
      - "sync/**"
      - "tests/**"
      - "requirements.txt"
      - "supabase/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "app/**"
      - "parsers/**"
      - "transform/**"
      - "sync/**"
      - "tests/**"
      - "requirements.txt"
      - "supabase/**"
      - ".github/workflows/ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      # Las Edge Functions de cobro corren en Deno (supabase/functions/).
      - name: Typecheck de las Edge Functions
        working-directory: supabase/functions
        run: npx -y deno check */index.ts

  python:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      # Sin PDFs reales (nunca salen de la laptop): las pruebas usan texto
      # sintético. La interfaz Tkinter no se prueba aquí (app/logica.py sí).
      - name: Pruebas
        run: python -m unittest discover -s tests -t .

  # Aislamiento entre usuarios (puerta de la fase 0 de FinanzasPersonales):
  # aplica todas las migraciones a un Postgres vacío con lo mínimo de Supabase
  # (supabase/tests/stub_supabase.sql) y comprueba que un usuario no ve, cambia,
  # borra ni referencia filas de otro, y que borrar una cuenta borra sus filas.
  rls:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Migraciones + pruebas de RLS
        run: supabase/tests/correr.sh
