name: CI

# Red de seguridad antes de llegar a main (que despliega solo): typecheck,
# lint y pruebas en cada push y PR. deploy.yml solo construye en main y no
# corre ni lint ni pruebas.
on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
