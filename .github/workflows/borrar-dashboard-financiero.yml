name: Borrar proyecto Pages viejo (dashboard-financiero)

# De un solo uso (2026-11-26, Mario: "ya no quiero que siga activo el dominio
# dashboard financiero"). Borra el proyecto `dashboard-financiero`
# (dashboard-financiero-c5z.pages.dev). NUNCA toca `dashboard-personal`.
# Se elimina este archivo después de correr.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/borrar-dashboard-financiero.yml"
  workflow_dispatch:

jobs:
  borrar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Borrar deployments y proyecto
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VIEJO="dashboard-financiero"
          [[ $VIEJO != "dashboard-personal" ]] || { echo "::error::nombre equivocado"; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/${CF_CUENTA}/pages/projects"
          H=(-H "Authorization: Bearer ${CF_TOKEN}")
          p=$(curl -sS "${API}/${VIEJO}" "${H[@]}")
          if [[ $(jq -r '.success' <<<"$p") != "true" ]]; then
            echo "El proyecto ${VIEJO} ya no existe: $(jq -c '.errors' <<<"$p")"; exit 0
          fi
          sub=$(jq -r '.result.subdomain' <<<"$p")
          echo "Subdominio: $sub"
          [[ $sub == dashboard-financiero-* ]] || { echo "::error::Subdominio inesperado ($sub); no borro nada."; exit 1; }
          # El proyecto nuevo debe existir antes de borrar el viejo.
          n=$(curl -sS "${API}/dashboard-personal" "${H[@]}")
          [[ $(jq -r '.success' <<<"$n") == "true" ]] || { echo "::error::No veo dashboard-personal; no borro nada."; exit 1; }
          echo "Proyecto nuevo: $(jq -r '.result.subdomain' <<<"$n")"
          # Cloudflare no deja borrar un proyecto con muchos deployments: primero se borran.
          total=0
          for vuelta in $(seq 1 60); do
            d=$(curl -sS "${API}/${VIEJO}/deployments?per_page=25" "${H[@]}")
            ids=$(jq -r '.result[]?.id' <<<"$d")
            [[ -n $ids ]] || break
            for id in $ids; do
              r=$(curl -sS -X DELETE "${API}/${VIEJO}/deployments/${id}?force=true" "${H[@]}")
              if [[ $(jq -r '.success' <<<"$r") == "true" ]]; then total=$((total+1)); else echo "No se borró $id: $(jq -c '.errors' <<<"$r")"; fi
            done
          done
          echo "Deployments borrados: $total"
          r=$(curl -sS -X DELETE "${API}/${VIEJO}" "${H[@]}")
          echo "Borrar proyecto: $(jq -c '{success, errors}' <<<"$r")"
          [[ $(jq -r '.success' <<<"$r") == "true" ]]
          echo "✓ Proyecto ${VIEJO} borrado" >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar ligas
        run: |
          sleep 20
          for u in https://dashboard-financiero-c5z.pages.dev/ https://dashboard-personal-8uu.pages.dev/; do
            echo "$u -> $(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$u" || echo 'sin respuesta')"
          done
